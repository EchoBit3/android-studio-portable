name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run repo test suites
        run: bash tests/run-tests.sh

  # Matriz multi-distro sin bootstrap: cada imagen ya trae bash/tar/coreutils
  # y lo que la suite necesita. CachyOS usa su imagen oficial (es Arch con su
  # kernel/repos); Arch sirve como referencia del userspace base que CachyOS
  # deriva. fail-fast: false para que cada familia informe por separado.
  test-distros:
    name: suite ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: cachyos
            image: docker.io/cachyos/cachyos:latest
          - distro: archlinux
            image: docker.io/library/archlinux:latest
          - distro: fedora
            image: docker.io/library/fedora:latest
          - distro: debian
            image: docker.io/library/debian:stable-slim
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Run repo test suites
        run: bash tests/run-tests.sh
