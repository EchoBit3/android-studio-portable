name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run repo test suites
        run: bash tests/run-tests.sh

  # Matriz multi-distro: la misma suite sobre el userspace de cada familia.
  # CachyOS usa su imagen oficial (es Arch con su kernel/repos); Arch sirve
  # como referencia del userspace base que CachyOS deriva.
  test-distros:
    name: suite ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: cachyos
            image: docker.io/cachyos/cachyos:latest
            bootstrap: pacman -Sy --noconfirm git tar curl util-linux coreutils
          - distro: archlinux
            image: docker.io/library/archlinux:latest
            bootstrap: pacman -Sy --noconfirm git tar curl util-linux coreutils
          - distro: fedora
            image: docker.io/library/fedora:latest
            bootstrap: dnf -y install git tar curl util-linux coreutils
          - distro: debian
            image: docker.io/library/debian:stable-slim
            bootstrap: apt-get update -qq && apt-get -y -qq install git tar curl util-linux coreutils
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Dependencias de la distro
        run: ${{ matrix.bootstrap }}
      - uses: actions/checkout@v7
      - name: Run repo test suites
        run: bash tests/run-tests.sh
